[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-trading-ml"
version = "0.1.0"
description = "Modular VWAGY return-prediction and trading backtest based on the original notebook"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "yfinance>=0.2.40",
]

[project.scripts]
quant-trading = "quant_trading.cli:main"

[tool.setuptools.packages.find]
include = ["quant_trading*"]
